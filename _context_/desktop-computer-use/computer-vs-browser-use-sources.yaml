  ## Terminology note

  ChatGPT's docs use "Computer Use" for browser control as well ([br]: "Computer Use lets ChatGPT Work or Codex operate
  the built-in browser directly"). The enterprise docs still keep "Browser Use" policies and "native Computer Use" as
  separate controls [wls]. The article follows the D-024 split, which matches the enterprise usage.

  ## Not sourced, or inference

  - **How either vendor sees and acts in the background on macOS.** Neither documents the capture API (window capture or
    full display) nor how input reaches a background window without the pointer moving.
  - **Whether ChatGPT Computer Use reads the accessibility tree.** Its page names screenshots and "screen content" only,
    and Accessibility only for acting.
  - **Pause on the user's own input outside Locked use.** ChatGPT documents it only for Locked use. Anthropic says
    Claude "generally waits if you're in the middle of typing" [cow].
  - **ChatGPT's full exclusion list.** Password managers, System Settings privacy panes and our own live view are D-024
    choices, not exclusions ChatGPT documents. Anthropic names trading and cryptocurrency apps as blocked by default.
  - **That an extension's `debugger` permission means CDP.** This is inference: Chrome's debugger API carries CDP, which
    neither help page states.
  - **That Claude in Chrome is built on the API's browser use tool.** Not stated. The article calls it only "the
    browser-use product".
  - **What carries over from M1-M4 beyond D-024's own list.** The article names only D-024's list. Which parts of
    agent-core (its page-text inspector, `sites.mjs`) and the live view (CDP screencast) need replacing is an
    unverified reading of the code index.

