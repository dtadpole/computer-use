  ## OpenAI and ChatGPT

  **[cu]** https://learn.chatgpt.com/docs/computer-use (markdown at `.md`)

  - "With Computer Use, ChatGPT can see and operate graphical user interfaces on macOS or Windows." (scope, ChatGPT section)
  - "Executing a workflow that spans more than one app." (scope)
  - "**Screen Recording** permission so ChatGPT can see the target app." and "**Accessibility** permission so ChatGPT can click, type, and navigate." (permissions, action channel)
  - "ChatGPT can view screen content, take screenshots, and interact with windows, menus, keyboard input, and clipboard state in the target app." (perception)
  - "On macOS, running a scoped task in the background while you keep working elsewhere." (action channel)
  - "With Computer Use, ChatGPT can see and take action only in the apps you allow. During a task, ChatGPT asks for your permission before it can use an app on your computer. You can choose **Always allow** ..." (consent model)
  - "ChatGPT may also ask for permission before taking sensitive or disruptive actions." (consent model)
  - "You can stop the task or take over your computer at any time." (ChatGPT section)
  - "Cancel the task if ChatGPT starts interacting with the wrong window." (failure modes)
